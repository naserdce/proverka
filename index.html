/* Layout: one phone-width column. The scene (two figures on an evening embankment) leads,
   the last message hangs over it as a speech bubble, the send buttons sit right under the thumb. */
:root{
  --bg:#eceaf2; --surface:#f9f7fc; --ink:#23202e; --muted:#6b6679; --line:#d5d0e0;
  --accent:#c2413b; --accent-ink:#ffffff; --accent-soft:#f6dedb;
  --sky-top:#8ea2ca; --sky-mid:#cdc5dc; --sky-low:#f7caa0;
  --far:#7d86a6; --water:#a3aecb; --glint:#e9d9d6; --stone:#8b8794; --stone-top:#aca8b6; --pave:#c4c0cc;
  --msg-me:#0a84ff; --msg-me-ink:#ffffff; --msg-them:#dcd9e4; --msg-them-ink:#17151d;
  --coat:#24212b; --fig-edge:transparent; --snow:0;
  --display:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14121b; --surface:#1f1c29; --ink:#f1eef7; --muted:#a59fb6; --line:#373247;
  --accent:#ef6a62; --accent-ink:#1b0f10; --accent-soft:#3a2428;
  --sky-top:#121831; --sky-mid:#2a2648; --sky-low:#5b3551;
  --far:#0f1326; --water:#1c2340; --glint:#6a5a86; --stone:#33303e; --stone-top:#474354; --pave:#262330;
  --msg-me:#0a84ff; --msg-me-ink:#ffffff; --msg-them:#2c2937; --msg-them-ink:#f1eef7;
  --coat:#17151d; --fig-edge:#7a748e; --snow:1; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14121b; --surface:#1f1c29; --ink:#f1eef7; --muted:#a59fb6; --line:#373247;
  --accent:#ef6a62; --accent-ink:#1b0f10; --accent-soft:#3a2428;
  --sky-top:#121831; --sky-mid:#2a2648; --sky-low:#5b3551;
  --far:#0f1326; --water:#1c2340; --glint:#6a5a86; --stone:#33303e; --stone-top:#474354; --pave:#262330;
  --msg-me:#0a84ff; --msg-me-ink:#ffffff; --msg-them:#2c2937; --msg-them-ink:#f1eef7;
  --coat:#17151d; --fig-edge:#7a748e; --snow:1; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
.app{max-width:440px;margin:0 auto;padding-inline:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .8s ease-out}
.count{margin:0;font-size:13px;color:var(--muted);display:flex;align-items:baseline;gap:6px}
.count b{font-family:var(--display);font-weight:700;font-size:26px;line-height:.8;color:var(--accent);font-variant-numeric:tabular-nums}

.scene{position:relative;border-radius:22px;overflow:hidden;
  background:linear-gradient(var(--sky-top) 0%,var(--sky-mid) 38%,var(--sky-low) 60%)}
.scene svg{display:block;width:100%;height:auto}
/* the scene keeps its own time of day, whatever theme the page is in */
[data-time="morning"]{--nk:0;--sky-top:#a9c7e8;--sky-mid:#f3d6d9;--sky-low:#fde3b8;--far:#93a0bd;--water:#b9cbe2;--glint:#fff3e0;--stone:#9a96a2;--stone-top:#b9b5c2;--pave:#cfcbd6;--coat:#24212b;--fig-edge:transparent}
[data-time="day"]{--nk:0;--sky-top:#5aa7e6;--sky-mid:#9ccdf2;--sky-low:#d6ecfb;--far:#7f95b3;--water:#6fa9d8;--glint:#e4f3ff;--stone:#9d9aa5;--stone-top:#bdbac6;--pave:#d3d0da;--coat:#24212b;--fig-edge:transparent}
[data-time="evening"]{--nk:.22;--sky-top:#8ea2ca;--sky-mid:#cdc5dc;--sky-low:#f7caa0;--far:#7d86a6;--water:#a3aecb;--glint:#e9d9d6;--stone:#8b8794;--stone-top:#aca8b6;--pave:#c4c0cc;--coat:#24212b;--fig-edge:transparent}
[data-time="night"]{--nk:.6;--sky-top:#121831;--sky-mid:#2a2648;--sky-low:#5b3551;--far:#0f1326;--water:#1c2340;--glint:#6a5a86;--stone:#33303e;--stone-top:#474354;--pave:#262330;--coat:#17151d;--fig-edge:#7a748e}
.rain{animation:rain .55s linear infinite} .snowfall{animation:snow 5s linear infinite}
@keyframes rain{to{transform:translate(-12px,48px)}} @keyframes snow{to{transform:translate(-10px,64px)}}
.bubble{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:-2px}
.bubble-in{--b:var(--msg-them);--t:var(--msg-them-ink);position:relative;max-width:80%;min-width:0;
  background:var(--b);color:var(--t);border-radius:19px;padding:8px 14px;overflow-wrap:anywhere}
.bubble[data-mine="1"] .bubble-in{--b:var(--msg-me);--t:var(--msg-me-ink)}
.bubble-in::before,.bubble-in::after{content:"";position:absolute;bottom:0;height:18px}
.bubble-in::before{left:-7px;width:20px;background:var(--b);border-bottom-right-radius:16px 14px}
.bubble-in::after{left:-10px;width:10px;background:var(--bg);border-bottom-right-radius:10px}
.bubble[data-mine="1"] .bubble-in::before{left:auto;right:-7px;border-radius:0;border-bottom-left-radius:16px 14px}
.bubble[data-mine="1"] .bubble-in::after{left:auto;right:-10px;border-radius:0;border-bottom-left-radius:10px}
.bubble-text{position:relative;z-index:1;font-size:16px;line-height:1.3;text-align:center}
.bubble-meta{font-size:11px;color:var(--muted)}

.far{fill:var(--far)} .water{fill:var(--water)} .glint{stroke:var(--glint)} .stone{fill:var(--stone)}
.stone-top{fill:var(--stone-top)} .pave{fill:var(--pave)}
.coat{fill:var(--coat);stroke:var(--fig-edge);stroke-width:1.2}
.fig,.arm{transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-origin:0 0}
.hop{transform-origin:0 0}
.scene.play .hop.is-sender{animation:hop .6s ease-out}
.wave{transform-origin:0 0;animation:wave .5s ease-in-out infinite alternate}
.float{animation:float 3.2s ease-in infinite}
.twinkle{animation:twinkle 1.4s ease-in-out infinite alternate}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
@keyframes float{0%{transform:translateY(8px);opacity:.15}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .fig,.arm{transition:none}
  .wave,.float,.twinkle,.rain,.snowfall,.confetti,.scene.play .hop.is-sender{animation:none}
}

.controls{display:flex;flex-direction:column;gap:14px}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.picks{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;flex-wrap:wrap;justify-content:flex-end;border:1.5px solid var(--line);border-radius:18px;padding:2px;background:var(--bg)}
.seg button{font:500 13px var(--body);color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint.warn{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button{font:600 13.5px/1.2 var(--body);min-height:58px;padding:8px 6px;border-radius:14px;cursor:pointer;
  background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-bottom-width:4px;text-wrap:balance}
.grid button:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.grid button.hot{background:var(--accent-soft);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

form{display:flex;gap:8px}
form input{flex:1;min-width:0;font:400 15px var(--body);color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:14px;padding:11px 13px}
form button{font:600 14px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:0 16px;cursor:pointer}

h2{font:500 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 0}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.log li span:first-child{min-width:0;overflow-wrap:anywhere}
.log b{font-weight:600}
.log time{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
.log .empty{color:var(--muted);border:0}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-title{margin:0;font-family:var(--display);font-weight:700;font-size:23px;line-height:1.1}
.who-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who-row button{font:600 15px var(--body);min-height:52px;border-radius:14px;cursor:pointer;background:var(--accent);color:var(--accent-ink);border:0}
.who-row a{display:flex;align-items:center;justify-content:center;text-decoration:none;font:600 15px var(--body);min-height:52px;border-radius:14px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.dim{fill:#141225;opacity:0;pointer-events:none}
.scene[data-indoor="1"][data-time="evening"] .dim{opacity:.16}
.scene[data-indoor="1"][data-time="night"] .dim{opacity:.42}
#rebubble{margin-top:-6px}
.react{align-self:center;font:600 15px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 22px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:500 13px var(--body);padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.swatches{display:flex;gap:8px}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:2px}
details.card{display:block}
summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:23px;line-height:1.1}
details .picks{margin-top:12px}
.pick{align-items:flex-start}
.pick>span{padding-top:7px}
.stats{display:flex;gap:14px}
.stat{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--muted);white-space:nowrap}
.stat b{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;color:var(--ink);display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.stat svg{width:14px;height:14px;fill:var(--accent)}
.city{font:600 11px var(--body);fill:#fff;paint-order:stroke;stroke:rgba(20,18,37,.5);stroke-width:3px}
.party{margin:0;text-align:center;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;text-wrap:balance;color:var(--accent)}
.confetti{transform-box:fill-box;transform-origin:center;animation:confetti linear infinite}
@keyframes confetti{from{transform:translateY(0) rotate(0)}to{transform:translateY(600px) rotate(720deg)}}
.switch{align-self:center;background:none;border:0;color:var(--muted);font:400 12px var(--body);text-decoration:underline;cursor:pointer;padding:8px}
</style>
</head>

const CODE=/^[A-Za-z0-9_-]{6,40}$/;
const TOKEN=/^\d{5,}:[A-Za-z0-9_-]{30,}$/;
function cleanTg(t){ if(!t||typeof t!=='object'||typeof t.token!=='string'||!TOKEN.test(t.token)) return null;
  const c=t.chats||{}; return {token:t.token,bot:String(t.bot||'').replace(/[^A-Za-z0-9_]/g,''),chats:{alya:+c.alya||0,andrey:+c.andrey||0}}; }
let raw={}, tg=null, tgNote='', tgBusy=false;
let state=normalize(null), me=null, code=null, sending=false, shownTs=null, loaded=false, es=null;
{ let h=''; try{ h=decodeURIComponent(location.hash.slice(1)); }catch(e){}
  if(CODE.test(h)){ code=h; store('pair-code',h); } else { const c=store('pair-code'); if(c&&CODE.test(c)) code=c; }
  const m=store('pair-me'); if(NAMES[m]) me=m; }
const url=()=>DB_URL+'/rooms/'+code+'.json';

const ACTIVE_MS=2*3600*1000;
let live={}; try{ live=JSON.parse(store('live-wx')||'{}')||{}; }catch(e){ live={}; }
function wxOf(c){ return (c>=71&&c<=77)||c===85||c===86?'snow':(c>=51&&c<=67)||(c>=80&&c<=82)||c>=95?'rain':'clear'; }
async function loadWeather(){
  await Promise.all(Object.keys(CITY).map(async id=>{ try{ const c=CITY[id];
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+c.lat+'&longitude='+c.lon+'&current=temperature_2m,weather_code');
    const j=await r.json(); if(j&&j.current&&isFinite(+j.current.temperature_2m)) live[id]={weather:wxOf(+j.current.weather_code),temp:Math.round(+j.current.temperature_2m),at:Date.now()}; }catch(e){} }));
  store('live-wx',JSON.stringify(live)); render();
}
function hourTime(){ const h=(new Date().getUTCHours()+3)%24; return h>=6&&h<11?'morning':h>=11&&h<17?'day':h>=17&&h<22?'evening':'night'; }
function cond(id){ const sc=state.scene; if(sc.mode==='manual') return {time:sc.time,weather:sc.weather,temp:null};
  const l=live[id], ok=l&&typeof l.at==='number'&&Date.now()-l.at<3*3600*1000&&WX[l.weather];
  return {time:hourTime(),weather:ok?l.weather:'clear',temp:ok&&isFinite(l.temp)?l.temp:null}; }
let shownHour='';
let wasActive=false;
function progress(){ const t=new Date(2026,10,21), s0=new Date(2026,9,9), now=Date.now(); return {f:Math.min(1,Math.max(0,(now-s0)/(t-s0))),today:now>=t&&now-t<864e5}; }
function isActive(){ const l=state.last; return !!l&&Date.now()-Math.max(l.ts,l.re?l.re.ts:0)<ACTIVE_MS; }
function moodOf(id){ const m=state.moods[id]; return m&&new Date(m.ts).toDateString()===new Date().toDateString()?m.k:null; }
function render(){
  const last=state.last, scene=$('scene'), pr=progress(), sc=state.scene;
  const from=last?last.from:'alya', other=from==='alya'?'andrey':'alya';
  let fx={sky:'',fx:''}; wasActive=isActive(); shownHour=hourTime();
  const cA=cond('alya'), cN=cond('andrey');
  const split=sc.place==='cities'&&!wasActive&&!pr.today, place=sc.place==='cities'?'embankment':sc.place, indoor=!!INDOOR[place];
  const cJ=sc.place==='cities'&&wasActive?cond(last.re?other:from):cA;
  const mk=c=>({hat:!indoor&&(c.weather==='snow'||(c.temp!==null&&c.temp<=0)),umb:!indoor&&c.weather==='rain',cup:c.time==='morning'});
  acc={alya:mk(split?cA:cJ),andrey:mk(split?cN:cJ)};
  const gap=(split?180:168)-(split?74:62)*pr.f; FIG.alya.x=181-gap/2; FIG.andrey.x=181+gap/2;
  weather({split,place,cA,cN,c:cJ,party:pr.today});
  $('party').hidden=!pr.today;
  { const st=state.stats, t=mskDay(), today=st.day===t?st.count:0, streak=st.day===t||st.day===mskDay(1)?st.streak:0;
    $('stats').hidden=!loaded; $('st-today').textContent=today; $('st-streak').textContent=streak; $('st-streak-t').textContent=plural(streak,'день','дня','дней')+' подряд'; }
  if(wasActive){ let key=last.re?'re_'+last.kind:last.kind; if(!POSES[key]) key=last.kind;
    pose(from,POSES[key].S); pose(other,POSES[key].P); fx=fxMarkup(key,from); }
  else if(pr.today){ pose('alya',POSES.hug.S); pose('andrey',POSES.hug.P); fx=fxMarkup('hug','alya'); }
  else { const LOW={sad:1,miss:1,tired:1,angry:1}, ma=moodOf('alya'), mn=moodOf('andrey');
    const extra=(mine,theirs)=>mine==='miss'&&theirs==='miss'?{inner:58,lean:4}
      :LOW[theirs]&&!LOW[mine]?{inner:55,lean:3}
      :LOW[theirs]&&LOW[mine]?{inner:30,lean:2}
      :mine==='happy'&&theirs==='happy'?{outer:150,wave:1}:{};
    pose('alya',Object.assign({},ma?MOODS[ma].face:{},extra(ma,mn))); pose('andrey',Object.assign({},mn?MOODS[mn].face:{},extra(mn,ma))); }
  $('sky').innerHTML=indoor?'':fx.sky; $('fx').innerHTML=fx.fx;
  const actor=last&&last.re?other:from, sig=last?(last.re?last.re.ts:last.ts):0;
  document.querySelectorAll('.hop').forEach(h=>h.classList.toggle('is-sender',!!last&&h.parentNode.id==='fig-'+actor));
  if(last&&sig!==shownTs){
    const seen=+store('seen-ts')||0;
    if(shownTs!==null||sig>seen){ scene.classList.remove('play'); void scene.offsetWidth; scene.classList.add('play'); }
    store('seen-ts',String(sig));
  }
  if(loaded) shownTs=sig;
  $('bubble-text').textContent=last?last.text:'Здесь появится первое сообщение';
  $('bubble-meta').textContent=last?NAMES[last.from]+' · '+ago(last.ts):'';
  $('rebubble').hidden=!(last&&last.re); if(last&&last.re) $('re-text').textContent=REPLY[last.kind];
  const log=$('log'); log.textContent='';
  if(!state.log.length){ const li=document.createElement('li'); li.className='empty'; li.textContent='Пока пусто. Всё отправленное будет здесь.'; log.appendChild(li); }
  state.log.slice(0,8).forEach(m=>{
    const li=document.createElement('li'), s=document.createElement('span'), b=document.createElement('b'), t=document.createElement('time');
    b.textContent=NAMES[m.from]+': '; s.appendChild(b); s.appendChild(document.createTextNode(m.text+(m.re?' → '+REPLY[m.kind]:'')));
    t.textContent=ago(m.ts); li.appendChild(s); li.appendChild(t); log.appendChild(li);
  });
  renderControls();
}
function renderControls(){
  renderTg();
  const ready=!!DB_URL&&!!code;
  $('setup').hidden=!!DB_URL; $('code-card').hidden=!DB_URL||!!code; $('who-card').hidden=!ready||!!me;
  $('controls').hidden=!ready||!me; $('picks').hidden=me!=='alya';
  $('pick-time').hidden=$('pick-weather').hidden=state.scene.mode!=='manual';
  $('switch').hidden=!me; $('switch').textContent=me?'Это телефон '+(me==='alya'?'Али':'Андрея')+'. Сменить':'';
  const L=state.last;
  $('bubble').dataset.mine=L&&L.from===me?'1':'0'; $('rebubble').dataset.mine=L&&L.re&&L.from!==me&&me?'1':'0';
  const canReact=!!L&&!!me&&ready&&L.from!==me&&!L.re; $('react').hidden=!canReact; $('react').disabled=sending; if(canReact) $('react').textContent=REPLY[L.kind];
  const mood=me?moodOf(me):null;
  document.querySelectorAll('#moods button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.val===mood));
  document.querySelectorAll('#looks button').forEach(b=>b.setAttribute('aria-pressed',!!me&&b.dataset.val===state.looks[me]));
  document.querySelectorAll('.seg button').forEach(b=>{ b.disabled=sending; b.setAttribute('aria-pressed',state.scene[b.dataset.key]===b.dataset.val); });
  document.querySelectorAll('#grid button').forEach(b=>b.disabled=sending);
  $('note-input').disabled=sending; $('note-send').disabled=sending;
  if(!$('hint').classList.contains('warn')) $('hint').textContent='Отправь '+(me==='alya'?'Андрею':'Але')+':';
}
function warn(t){ const h=$('hint'); h.className='hint warn'; h.textContent=t; }
function apply(d){ raw=d&&typeof d==='object'?d:{}; tg=cleanTg(raw.tg); if(sending) return; loaded=true; state=normalize(raw); render(); }
async function refetch(){ if(!DB_URL||!code) return; try{ const r=await fetch(url()); if(r.ok) apply(await r.json()); }catch(e){} }
function connect(){
  if(!DB_URL||!code) return;
  if(es) es.close();
  es=new EventSource(url());
  es.addEventListener('put',e=>{ try{ const m=JSON.parse(e.data); if(m.path==='/') apply(m.data); else refetch(); }catch(_){} });
  es.addEventListener('patch',e=>{ try{ const m=JSON.parse(e.data); if(m.path==='/'&&m.data) apply(Object.assign({},raw,m.data)); else refetch(); }catch(_){} });
  es.addEventListener('cancel',()=>warn('Нет доступа к базе. Проверь код.'));
}
async function commit(next){
  if(!me||sending||!DB_URL||!code) return false;
  const prev=state; $('hint').className='hint'; sending=true; state=next; render();
  try{ const r=await fetch(url(),{method:'PATCH',body:JSON.stringify({last:next.last,log:next.log,scene:next.scene,stats:next.stats})}); if(!r.ok) throw new Error(r.status); }
  catch(e){ state=prev; sending=false; render(); warn('Не получилось отправить. Проверь интернет и попробуй ещё раз.'); return false; }
  sending=false; renderControls(); return true;
}
function send(kind,text){
  const msg=clean({from:me,kind,text,ts:Date.now()}); if(!msg) return;
  commit(Object.assign({},state,{last:msg,log:[msg].concat(state.log).slice(0,20),stats:bump(state.stats)})).then(ok=>{ if(ok) notify(NAMES[me]+': '+msg.text); });
}
function react(){
  const L=state.last; if(!L||!me||L.from===me||L.re) return;
  const done=Object.assign({},L,{re:{ts:Date.now()}});
  const log=state.log.map((m,i)=>i===0&&m.ts===L.ts?done:m);
  commit(Object.assign({},state,{last:done,log,stats:bump(state.stats)})).then(ok=>{ if(ok) notify(NAMES[me]+' в ответ: '+REPLY[L.kind]); });
}
async function putChild(path,val){
  if(!me||!DB_URL||!code) return;
  const top=path.split('/')[0], key=path.split('/')[1];
  raw=Object.assign({},raw,{[top]:Object.assign({},raw[top],{[key]:val})}); state=normalize(raw); render();
  try{ const r=await fetch(DB_URL+'/rooms/'+code+'/'+path+'.json',{method:'PUT',body:JSON.stringify(val)}); if(!r.ok) throw new Error(r.status); }
  catch(e){ warn('Не получилось сохранить. Проверь интернет и попробуй ещё раз.'); }
}
function setMood(k){ putChild('moods/'+me,{k,ts:Date.now()}); }
function setLook(k){ putChild('looks/'+me,k); }
// ---------- Telegram notifications ----------
async function tgApi(token,method,params){
  const r=await fetch('https://api.telegram.org/bot'+token+'/'+method,{method:'POST',body:new URLSearchParams(params)});
  const j=await r.json(); if(!j.ok) throw new Error(j.description||'telegram'); return j.result;
}
function notify(text){
  const other=me==='alya'?'andrey':'alya'; if(!tg||!tg.chats[other]) return;
  tgApi(tg.token,'sendMessage',{chat_id:String(tg.chats[other]),text:text,
    reply_markup:JSON.stringify({inline_keyboard:[[{text:'Открыть',url:location.origin+location.pathname+'#'+code}]]})}).catch(()=>{});
}
function renderTg(){
  const card=$('tg-card'); card.hidden=!DB_URL||!code||!me||!loaded; if(card.hidden) return;
  const other=me==='alya'?'andrey':'alya', mine=tg&&tg.chats[me], theirs=tg&&tg.chats[other];
  $('tg-form').hidden=!!tg||me!=='alya'; $('tg-steps').hidden=!tg||!!mine;
  $('tg-check').disabled=tgBusy;
  let t;
  if(!tg) t=me==='alya'?'Вставь токен бота, который выдал BotFather.':'Аля ещё не подключила бота.';
  else if(!mine) t='Открой бота, нажми Start, вернись сюда и нажми «Готово».';
  else t='У тебя включены. У '+(other==='alya'?'Али':'Андрея')+' '+(theirs?'тоже включены.':'пока нет.');
  $('tg-text').textContent=tgNote||t; $('tg-text').className=tgNote?'hint warn':'hint';
  if(tg) $('tg-open').href='https://t.me/'+tg.bot+'?start='+me;
}
async function tgSaveToken(v){
  if(tgBusy) return;
  if(!TOKEN.test(v)){ tgNote='Это не похоже на токен. Он выглядит как 123456789:AAH… и копируется целиком.'; renderTg(); return; }
  tgBusy=true;
  try{ const bot=await tgApi(v,'getMe',{}); const obj={token:v,bot:bot.username,chats:{alya:0,andrey:0}};
    const r=await fetch(DB_URL+'/rooms/'+code+'/tg.json',{method:'PUT',body:JSON.stringify(obj)}); if(!r.ok) throw new Error('db');
    raw=Object.assign({},raw,{tg:obj}); tg=cleanTg(obj); tgNote=''; }
  catch(e){ tgNote='Не получилось проверить токен. Убедись, что он скопирован целиком, и попробуй ещё раз.'; }
  tgBusy=false; renderTg();
}
async function tgConnect(){
  if(!tg||tgBusy) return; tgBusy=true; renderTg();
  const other=me==='alya'?'andrey':'alya';
  try{
    const ups=await tgApi(tg.token,'getUpdates',{limit:'100',allowed_updates:'["message"]'});
    let exact=0, plain=0;
    ups.forEach(u=>{ const m=u.message; if(!m||!m.chat||m.chat.type!=='private'||typeof m.text!=='string') return;
      const t=m.text.trim(); if(t==='/start '+me) exact=m.chat.id; else if(t==='/start'&&m.chat.id!==tg.chats[other]) plain=m.chat.id; });
    const id=exact||plain;
    if(!id) tgNote='Пока не вижу тебя. Открой бота, нажми Start и попробуй ещё раз.';
    else { const r=await fetch(DB_URL+'/rooms/'+code+'/tg/chats/'+me+'.json',{method:'PUT',body:JSON.stringify(id)}); if(!r.ok) throw new Error('db');
      tg.chats[me]=id; tgNote=''; tgApi(tg.token,'sendMessage',{chat_id:String(id),text:'Готово! Сюда будут приходить уведомления.'}).catch(()=>{}); }
  }catch(e){ tgNote='Не получилось связаться с Telegram. Попробуй ещё раз.'; }
  tgBusy=false; renderTg();
}
function setScene(key,val){
  if(me!=='alya'||state.scene[key]===val) return;
  commit(Object.assign({},state,{scene:Object.assign({},state.scene,{[key]:val})}));
}
function setMe(v){ me=v; if(v) store('pair-me',v); render(); }

buildFigure('alya'); buildFigure('andrey');
Object.keys(KINDS).forEach(k=>{ if(k==='note') return;
  const b=document.createElement('button'); b.type='button'; b.id='send-'+k; b.textContent=KINDS[k].label;
  if(KINDS[k].hot) b.className='hot'; b.addEventListener('click',()=>send(k)); $('grid').appendChild(b); });
[['seg-place','place',PL],['seg-mode','mode',MODES],['seg-time','time',TIMES],['seg-weather','weather',WX]].forEach(a=>{ Object.keys(a[2]).forEach(v=>{
  const b=document.createElement('button'); b.type='button'; b.id='set-'+a[1]+'-'+v; b.dataset.key=a[1]; b.dataset.val=v; b.textContent=a[2][v];
  b.addEventListener('click',()=>setScene(a[1],v)); $(a[0]).appendChild(b); }); });
Object.keys(MOODS).forEach(k=>{ const b=document.createElement('button'); b.type='button'; b.id='mood-'+k; b.dataset.val=k; b.textContent=MOODS[k].label; b.addEventListener('click',()=>setMood(k)); $('moods').appendChild(b); });
Object.keys(LOOKS).forEach(k=>{ const b=document.createElement('button'); b.type='button'; b.id='look-'+k; b.dataset.val=k; b.setAttribute('aria-label',LOOK_NAMES[k]); b.title=LOOK_NAMES[k]; b.style.background=LOOKS[k]||'#24212b'; b.addEventListener('click',()=>setLook(k)); $('looks').appendChild(b); });
$('react').addEventListener('click',react);
$('me-alya').addEventListener('click',()=>setMe('alya'));
$('me-andrey').addEventListener('click',()=>setMe('andrey'));
$('switch').addEventListener('click',()=>setMe(null));
$('note-form').addEventListener('submit',e=>{ e.preventDefault(); const i=$('note-input'), v=i.value.trim(); if(!v) return; send('note',v); i.value=''; });
$('code-form').addEventListener('submit',e=>{ e.preventDefault(); const v=$('code-input').value.trim();
  if(!CODE.test(v)){ $('code-input').value=''; $('code-input').placeholder='Код не подходит'; return; }
  code=v; store('pair-code',v); try{ location.hash=v; }catch(_){} render(); connect(); });
$('tg-form').addEventListener('submit',e=>{ e.preventDefault(); tgSaveToken($('tg-token').value.trim()); });
$('tg-check').addEventListener('click',tgConnect);
$('scene').addEventListener('animationend',e=>{ if(e.animationName==='hop') $('scene').classList.remove('play'); });
render(); countdown(); connect(); loadWeather();
setInterval(loadWeather,20*60*1000);
setInterval(()=>{ countdown(); if(isActive()!==wasActive||hourTime()!==shownHour) render(); if(state.last) $('bubble-meta').textContent=NAMES[state.last.from]+' · '+ago(state.last.ts); },60000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible') return; if(es&&es.readyState===2) connect(); refetch(); const l=live.alya; if(!l||Date.now()-l.at>20*60*1000) loadWeather(); });
})();
</script>
