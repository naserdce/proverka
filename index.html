<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Перепроверка бланков</title>
<style>html{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Лист подсчёта: липкая шапка, плотная разлинованная сетка, белый лист на холодном сером фоне. */
:root {
  --bg: #eceef3;
  --surface: #ffffff;
  --surface-2: #f5f6f9;
  --ink: #161925;
  --muted: #5e6477;
  --line: #dcdfe7;
  --line-strong: #c3c8d4;
  --accent: #2b3bcc;
  --accent-ink: #ffffff;
  --accent-soft: #e5e8fb;
  --ok: #156b36;
  --ok-bg: #d9f0df;
  --no: #ad241c;
  --no-bg: #f9dad6;
  --near: #835400;
  --near-bg: #fbecbd;
  --shadow: 0 1px 2px rgba(22, 25, 37, .06), 0 8px 24px rgba(22, 25, 37, .08);
  --f-display: 'Unbounded', 'Onest', system-ui, sans-serif;
  --f-ui: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1016; --surface: #171a23; --surface-2: #1c202a; --ink: #e6e8f0; --muted: #9ba1b4;
    --line: #2a2e3a; --line-strong: #3b4150; --accent: #8f99ff; --accent-ink: #0e1016; --accent-soft: #232848;
    --ok: #79d597; --ok-bg: #163021; --no: #ff958c; --no-bg: #3a1a18; --near: #f2c75f; --near-bg: #362a0f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1016; --surface: #171a23; --surface-2: #1c202a; --ink: #e6e8f0; --muted: #9ba1b4;
  --line: #2a2e3a; --line-strong: #3b4150; --accent: #8f99ff; --accent-ink: #0e1016; --accent-soft: #232848;
  --ok: #79d597; --ok-bg: #163021; --no: #ff958c; --no-bg: #3a1a18; --near: #f2c75f; --near-bg: #362a0f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 26px; letter-spacing: -.01em; line-height: 1.15; }
h2 { font-size: 18px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.spacer { flex: 1; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.boot { min-height: 60vh; display: grid; place-content: center; gap: 8px; text-align: center; padding: 24px 16px; color: var(--muted); }
.boot .brand { font-size: 20px; color: var(--ink); }

/* шапка */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1400px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: -.01em; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); }
.gamepick select { max-width: min(46ch, 70vw); padding: 6px 30px 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface-2); }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); max-width: 46ch; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.sync.busy .dot { background: var(--near); }
.sync.err { color: var(--no); }
.sync.err .dot { background: var(--no); }
.sync-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner { background: var(--near-bg); color: var(--near); padding: 8px 16px; text-align: center; font-size: 13px; }

.wrap { max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; margin-block: 16px; box-shadow: var(--shadow); }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty h2 { color: var(--ink); }
.empty p { max-width: 60ch; }

/* кнопки */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line-strong); }
.btn.danger.armed, .btn.danger:hover { color: var(--no); }
.btn.armed { border-color: var(--no); background: var(--no-bg); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.xs { padding: 3px 8px; font-size: 12px; border-radius: 5px; }
.btn.okbtn { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.btn.okbtn:hover { background: var(--ok-bg); border-color: var(--ok); }
.btn.nobtn { color: var(--no); border-color: color-mix(in srgb, var(--no) 40%, transparent); }
.btn.nobtn:hover { background: var(--no-bg); border-color: var(--no); }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.row-actions.center { justify-content: center; }
.linkish { background: none; border: 0; padding: 0; font-weight: 600; cursor: pointer; text-align: left; }
.linkish:hover { color: var(--accent); }
.back { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; margin-bottom: 10px; }
.back:hover { color: var(--accent); }

.field { display: grid; gap: 4px; }
.field > span { font-size: 12.5px; color: var(--muted); }
.field input, .field textarea { padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); width: 100%; max-width: 60ch; }
.field.grow { flex: 1; min-width: 0; }

/* приветствие */
.welcome { max-width: 760px; margin: 24px auto; display: grid; gap: 18px; }
.welcome h1 { font-size: 32px; }
.lead { font-size: 16px; color: var(--muted); max-width: 62ch; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.steps > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; align-content: start; }
.steps span { color: var(--muted); font-size: 13px; }
.rounds-sum { display: grid; gap: 6px; }
.rsum { display: flex; gap: 10px; align-items: baseline; }
.rnum { font-family: var(--f-display); font-weight: 600; font-size: 13px; width: 2.4em; }
.warn { background: var(--near-bg); color: var(--near); padding: 10px 14px; border-radius: 6px; }
.warn ul { margin: 6px 0 0; padding-left: 18px; }

/* главная игры */
.gamehead { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 18px; }
.gh-main { display: grid; gap: 4px; min-width: 0; }
.gh-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin-bottom: 18px; }
.kpis > div { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; color: var(--muted); font-size: 12.5px; }
.kpis .k { font-family: var(--f-display); font-size: 22px; color: var(--ink); font-weight: 600; }
.kpis .hot .k { color: var(--no); }
.kpis .warm .k { color: var(--near); }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.import .checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.import label { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: separate; border-spacing: 0; }
.cities { width: 100%; min-width: 760px; }
.cities th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.cities td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.cities tr:last-child td { border-bottom: 0; }
.clickrow { cursor: pointer; }
.clickrow:hover td { background: var(--surface-2); }
.cities td.num { text-align: left; }
.prog { display: inline-block; vertical-align: middle; width: 90px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-right: 8px; }
.prog span { display: block; height: 100%; background: var(--accent); }
.chip { display: inline-block; min-width: 1.8em; padding: 1px 7px; border-radius: 999px; font-family: var(--f-mono); font-size: 12px; text-align: center; font-weight: 600; }
.chip.no { background: var(--no-bg); color: var(--no); }
.chip.near { background: var(--near-bg); color: var(--near); }
.who { font-weight: 500; }
.status { font-size: 12px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line-strong); white-space: nowrap; }
.st-work { border-color: var(--near); color: var(--near); }
.st-done { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }

/* город */
.cityhead { margin-bottom: 12px; }
.ch-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.status-select { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line-strong); margin-bottom: 0; }
.tab { position: relative; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
.tab .tnum { font-family: var(--f-display); font-weight: 600; font-size: 14px; }
.tab.total { font-weight: 600; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; font-family: var(--f-mono); }
.badge.near { background: var(--near-bg); color: var(--near); }
.badge.no { background: var(--no-bg); color: var(--no); }

.roundinfo { display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: baseline; padding: 12px 2px; }
.rname { font-weight: 600; }
.hint { color: var(--muted); font-size: 12.5px; }

.gridwrap { overflow: auto; max-height: calc(100vh - 230px); min-height: 240px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.grid, .totals { min-width: 100%; }
.grid th, .grid td, .totals th, .totals td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; }
.grid thead th, .totals thead th { position: sticky; top: 0; z-index: 3; background: var(--surface-2); font-size: 12px; color: var(--muted); font-weight: 600; text-align: left; vertical-align: bottom; }
.teamcol { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left; min-width: 170px; max-width: 240px; }
thead .teamcol { z-index: 4; padding: 8px 10px; }
tbody .teamcol { font-weight: 500; }
tbody .teamcol { padding: 0 4px 0 10px; }
tbody .teamcol { display: table-cell; }
.tname { display: inline-block; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; padding: 8px 0; }
.rowdel { float: right; margin-top: 5px; opacity: 0; }
tr:hover .rowdel, .rowdel:focus, .rowdel.armed { opacity: 1; }
.qh { min-width: 150px; max-width: 220px; }
.grid.chairs .qh { min-width: 210px; }
.qbtn { display: grid; gap: 2px; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; cursor: pointer; color: inherit; }
.qbtn:hover { background: var(--accent-soft); }
.qn { font-family: var(--f-display); font-size: 13px; color: var(--ink); display: flex; gap: 6px; align-items: center; }
.qa { font-weight: 500; color: var(--muted); font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-wrap: pretty; }
.sumcol { min-width: 84px; padding: 0 10px !important; text-align: right; white-space: nowrap; }
thead .sumcol { padding: 8px 10px !important; }
.okmark { color: var(--ok); }

.cell { background: var(--surface); transition: background-color .15s; }
.cellin { display: flex; align-items: stretch; min-height: 38px; }
.cell input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; padding: 8px 8px; outline: none; }
.cell input:focus { box-shadow: inset 0 0 0 2px var(--accent); }
.cell.s-ok { background: var(--ok-bg); }
.cell.s-no, .cell.s-multi { background: var(--no-bg); }
.cell.s-near { background: var(--near-bg); }
.mark { flex: none; min-width: 30px; border: 0; background: none; cursor: pointer; font-family: var(--f-mono); font-weight: 700; font-size: 12.5px; padding: 0 6px; }
.s-ok .mark { color: var(--ok); }
.s-no .mark, .s-multi .mark { color: var(--no); }
.s-near .mark { color: var(--near); }
.s-empty .mark { color: var(--muted); }
.cell.ovr .mark { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.cell.ovr::after { content: ''; }
.bet { flex: none; align-self: center; margin-left: 5px; border: 1px dashed var(--line-strong); background: transparent; color: var(--muted); border-radius: 4px; font-size: 11px; font-weight: 700; padding: 2px 4px; cursor: pointer; font-family: var(--f-mono); }
.bet[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); }

.addteam { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.addteam input { padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); min-width: 0; flex: 0 1 280px; }

/* итог */
.totals td, .totals th { padding: 8px 10px; white-space: nowrap; }
.totals thead th { padding: 8px 10px; }
.totals td.num { min-width: 64px; }
.totals .total b { font-size: 15px; }
.totals .was { display: block; font-size: 11px; color: var(--no); font-weight: 500; }
.totals td.diff { background: var(--no-bg); }
.totals td.notyet { color: var(--muted); background: repeating-linear-gradient(135deg, transparent 0 6px, var(--surface-2) 6px 12px); }
.totals tr.hasdiff .teamcol { box-shadow: inset 3px 0 0 var(--no); }
.totals .badge { margin-left: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 12px; margin-top: 10px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.lg { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid var(--line); }
.lg.diff { background: var(--no-bg); }
.lg.near { background: var(--near-bg); }
.lg.notyet { background: repeating-linear-gradient(135deg, var(--surface) 0 3px, var(--line-strong) 3px 5px); }

/* панель вопроса */
.drawer-back { position: fixed; inset: 0; z-index: 40; background: rgba(10, 12, 20, .32); display: flex; justify-content: flex-end; }
.drawer { width: min(520px, 100%); height: 100%; overflow-y: auto; background: var(--surface); box-shadow: var(--shadow); padding: calc(16px + env(safe-area-inset-top, 0px)) 18px calc(24px + env(safe-area-inset-bottom, 0px)); display: block; }
.dhead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
.dnav { display: flex; gap: 4px; }
.unit { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.urow { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: baseline; }
.urow > :last-child { min-width: 0; }
.ulab { font-size: 12px; color: var(--muted); }
.uans { font-size: 16px; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.kchip { display: inline-flex; align-items: center; gap: 2px; padding: 2px 4px 2px 8px; border-radius: 5px; font-size: 13px; background: var(--ok-bg); color: var(--ok); }
.kchip.rej { background: var(--no-bg); color: var(--no); }
.kchip .x { border: 0; background: none; cursor: pointer; color: inherit; padding: 0 4px; font-size: 15px; line-height: 1; opacity: .7; }
.kchip .x:hover { opacity: 1; }
.addinline { display: flex; gap: 6px; }
.addinline input { flex: 1; min-width: 0; padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--surface); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 5px; overflow: hidden; margin-right: 6px; }
.seg button { border: 0; background: var(--surface); padding: 2px 10px; cursor: pointer; font-family: var(--f-mono); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.subs { display: grid; gap: 4px; }
.sub { border-bottom: 1px solid var(--line); padding-top: 10px; }
.sub .unit { border-bottom: 0; padding-top: 6px; }
.subh { display: flex; gap: 10px; align-items: baseline; }
.subn { font-family: var(--f-display); font-size: 12px; width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.pts { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.groups { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.g { border: 1px solid var(--line); border-left-width: 4px; border-radius: 6px; padding: 10px 12px; display: grid; gap: 4px; }
.g.s-ok { border-left-color: var(--ok); }
.g.s-no, .g.s-multi { border-left-color: var(--no); }
.g.s-near { border-left-color: var(--near); background: color-mix(in srgb, var(--near-bg) 45%, transparent); }
.gtop { display: flex; gap: 10px; align-items: baseline; }
.gmark { font-family: var(--f-mono); font-weight: 700; width: 2.4em; flex: none; }
.s-ok .gmark { color: var(--ok); } .s-no .gmark, .s-multi .gmark { color: var(--no); } .s-near .gmark { color: var(--near); }
.graw { font-weight: 600; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.gcount { margin-left: auto; font-family: var(--f-mono); color: var(--muted); font-size: 12px; }
.gact { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

/* ключ */
.keyhead { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 8px; }
.keyround { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-top: 16px; overflow: hidden; }
.krh { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.rbig { font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--accent); }
.krt { display: grid; }
.mini { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.mini select { padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--surface); }
.kqs { display: grid; }
.kq { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.kq:last-child { border-bottom: 0; }
.kqn { font-family: var(--f-display); font-weight: 600; color: var(--muted); padding-top: 2px; }
.kqbody { min-width: 0; }
.kqbody .unit { border-bottom: 0; padding: 6px 0 0; }
.subs.inline .sub:first-child { padding-top: 0; }
.subs.inline .sub:last-child { border-bottom: 0; }
.dangerzone { margin-top: 32px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow); max-width: min(560px, calc(100vw - 32px)); font-size: 13.5px; }
.toast.err { background: var(--no); color: var(--surface); }

@media (max-width: 640px) {
  h1 { font-size: 22px; }
  .welcome h1 { font-size: 26px; }
  .teamcol { min-width: 120px; max-width: 150px; }
  .tname { max-width: 120px; }
  .qh { min-width: 130px; }
  .urow { grid-template-columns: 1fr; gap: 4px; }
  .gridwrap { max-height: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* правки после первой проверки */
.grid thead .teamcol, .totals thead .teamcol { z-index: 5; }
.gridwrap { scroll-padding-left: 200px; scroll-padding-top: 64px; }
.tcell { display: flex; align-items: center; gap: 4px; min-height: 38px; }
.tcell .tname { flex: 1; min-width: 0; padding: 0; }
.rowdel { float: none; margin: 0; flex: none; }
.grid.k-choice .qh { min-width: 112px; }
.grid.k-normal .qh { min-width: 176px; }
.grid.k-chairs .qh { min-width: 200px; }
@media (hover: hover) {
  .bet { opacity: 0; }
  tr:hover .bet, .cell:focus-within .bet, .bet[aria-pressed="true"], .bet:focus-visible { opacity: 1; }
}
.totals thead th.num { text-align: right; }
.kq { grid-template-columns: 34px minmax(150px, 260px) 1fr; align-items: start; }
.kq.block { grid-template-columns: 34px 1fr; }
.kans { display: grid; gap: 2px; min-width: 0; padding-top: 3px; }
.kans .pts { margin-left: 0; }
.kblock { display: grid; gap: 8px; }
.ksub { display: grid; grid-template-columns: 26px minmax(150px, 226px) 1fr; gap: 10px; align-items: start; }
.uinline { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-width: 0; }
.uinline .addinline { flex: 0 1 220px; }
.uinline .addinline input { padding: 3px 8px; font-size: 12.5px; }
.needsel { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.needsel .seg { margin: 0 2px; }
.rejline { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.note { flex-basis: 100%; }
@media (max-width: 720px) {
  .kq, .ksub { grid-template-columns: 26px 1fr; }
  .kq > .uinline, .ksub > .uinline { grid-column: 2; }
}


/* имена и проверяющие раундов */
.modal-back { position: fixed; inset: 0; z-index: 70; background: rgba(10, 12, 20, .45); display: grid; place-items: center; padding: 16px; }
.modal { width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; display: grid; gap: 14px; }
.names { display: flex; flex-wrap: wrap; gap: 8px; }
.names .btn { min-width: 84px; }
.modal .addinline input { padding: 8px 10px; font-size: 14px; }
.mebtn { font-weight: 600; }
.rcs { display: flex; flex-wrap: wrap; gap: 4px 6px; min-width: 250px; max-width: 420px; }
.rc { display: inline-flex; gap: 5px; align-items: baseline; font-size: 12px; padding: 1px 7px; border: 1px solid var(--line-strong); border-radius: 4px; white-space: nowrap; }
.rc b { font-family: var(--f-mono); font-weight: 600; color: var(--muted); }
.rc.none { color: var(--muted); border-style: dashed; }
.rc.me { background: var(--accent-soft); border-color: var(--accent); }
.twho { font-size: 12px; font-weight: 500; }
.rcheck { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.gate .panel { margin-block: 0; }
</style>
